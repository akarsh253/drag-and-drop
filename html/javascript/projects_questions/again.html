<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do it again son.</title>
</head>
<body>
    <header><h2>Rock paper Scissor</h2></header>
    <button onclick="playgame('Rock')">Rock</button>
    <button onclick="playgame('Paper')">Paper</button>
    <button onclick="playgame('Scissors')">Scissors</button>
    <button onclick="score.wins =0,score.loss=0,score.ties=0, 
    localStorage.removeItem('score')">Reset score</button>


    <script>

        let score = JSON.parse(localStorage.getItem('score'))||{
               wins : 0,
               loss : 0,
               ties : 0
            };
       /* if (score === null){
            score = {
               wins : 0,
               loss : 0,
               ties : 0
            };

        }*/


        function computerMove (){
            let random = Math.random()
            let move = '';
            if(random<1/3){
                move = 'Rock'
            }else if (random<2/3){
                move = 'Paper'
            }else if(random<1){
                move = 'Scissors'
            }
            return move;
        }
        function playgame(Playermove){
            const computer = computerMove()
            let result = '';
            if (Playermove === 'Rock'){
                if (computer === 'Rock'){
                    result = 'Tie';
                }else if (computer === 'Paper'){
                    result = 'You Lose';
                }else if (computer === 'Scissors'){
                    result = 'You Win'
                }
            } 
            if (Playermove === 'Paper'){
                if (computer === 'Rock'){
                    result = 'You Win';
                }else if (computer === 'Paper'){
                    result = 'Tie';
                }else if (computer === 'Scissors'){
                    result = 'You Lose'
                }
        }  if (Playermove === 'Scissors'){
                if (computer === 'Rock'){
                    result = 'You Lose';
                }else if (computer === 'Paper'){
                    result = 'You Win';
                }else if (computer === 'Scissors'){
                    result = 'Tie'
                }
            }
          if (result === 'You Win'){
            score.wins +=1
          }else if (result === 'You Lose'){
            score.loss +=1
          }else if (result === "Tie"){
            score.ties +=1
          }
          localStorage.setItem('score',JSON.stringify(score))

           alert(`Computer chose ${computer} : ${result}
    Wins :${score.wins}, Losses:${score.loss},Ties:${score.ties}`);
         
    
    }
    </script>
</body>
</html>
