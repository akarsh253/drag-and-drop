<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--radio tag is used to define a single choice in entitites that have the same name-->
    <form action="">
        <label for="Male">Male</label>
        <input type="radio" id="Male" name="gender" ><br>
        <label for="Female">Female</label>
        <input type="radio" id="Female" name="gender" ><br>
        <label for="Other">Other</label>
        <input type="radio" id="Other" name="gender" ><br>
    </form>
    <form>
        <textarea rows="5" cols="5" placeholder="default text here"></textarea>
    </form>
</body>
</html>
